<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прокат настольных игр</title>
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Прокат настольных игр</h1>
        <input type="checkbox" id="onlyFree">
        <label for="onlyFree">Только свободные</label>
        <ul id="gameList"></ul>
        <h2>Выдача и возврат игры</h2>
        <label>Игра</label>
        <select id="gameSelect"></select>
        <button id="addCopyButton">Добавить копию</button>
        <label>Имя посетителя</label>
        <input type="text" id="borrowerName" placeholder="Введите имя">
        <button id="borrowButton">Выдать</button>
        <button id="returnButton">Вернуть</button>
        <p id="message"></p>
        <hr>
        <h2>Добавить игру</h2>
        <label>Название игры</label>
        <input type="text" id="gameTitle" placeholder="Название игры">
        <label>Число игроков</label>
        <input type="number" id="gamePlayers" min="1" step="1" placeholder="Число игроков">
        <label>Количество копий</label>
        <input type="number" id="gameCopies" placeholder="Количество копий">
        <button id="addGameButton">Добавить игру</button>
    </div>
</body>
</html>
